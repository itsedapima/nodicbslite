{% extends 'base.html' %}
{% block title %}Send SMS — NODi Lite{% endblock %}
{% block content %}
<div class="page-shell">
    <div class="page-head">
        <div><h2><i class="bi bi-send me-2"></i>Send SMS</h2></div>
        <a href="{% url 'sms:log_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body p-4">
                    <form method="post" class="d365-form">
                        {% csrf_token %}
                        <div class="field-group">
                            <label for="id_member">Select Member</label>
                            <select name="member" id="id_member" onchange="fillPhone(this)">
                                <option value="">-- Select Member --</option>
                                {% for m in members %}<option value="{{ m.pk }}" data-phone="{{ m.phone_number }}">{{ m.first_name }} {{ m.last_name }} ({{ m.phone_number }})</option>{% endfor %}
                            </select>
                        </div>
                        <div class="field-group">
                            <label for="id_phone">Recipient Phone *</label>
                            <input type="tel" name="phone" id="id_phone" required placeholder="e.g. 0712345678">
                        </div>
                        <div class="field-group">
                            <label for="id_message">Message * <span class="text-muted small" id="char-count">(0/160)</span></label>
                            <textarea name="message" id="id_message" rows="4" maxlength="160" required
                                      oninput="updateCount(this)"></textarea>
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i> Send</button>
                            <a href="{% url 'sms:log_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function fillPhone(sel){
    var opt=sel.options[sel.selectedIndex];
    if(opt.dataset.phone) document.getElementById('id_phone').value=opt.dataset.phone;
}
function updateCount(el){
    document.getElementById('char-count').textContent='('+el.value.length+'/160)';
}
</script>
{% endblock %}
