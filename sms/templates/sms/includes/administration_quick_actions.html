{% load static %}

<style>
    .sticky-admin-toolbar {
        position: -webkit-sticky;
        position: sticky;
        top: 100px;
        z-index: 1020;
        background-color: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(8px);
        border-bottom: 2px solid #dee2e6 !important;
    }
</style>

<div class="card mb-4 shadow-sm border-0 sticky-admin-toolbar">
    <div class="card-body py-2 px-3">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            
            <div class="d-flex align-items-center">
                <span class="badge bg-secondary-subtle text-secondary p-2 me-2">
                    <i class="bi bi-gear-wide-connected fs-6"></i>
                </span>
                <h6 class="mb-0 fw-bold d-none d-lg-inline-block text-dark">Administration</h6>
            </div>

            <div class="d-flex flex-wrap align-items-center gap-2">
                
                <div class="btn-group btn-group-sm">
                    <a href="{% url 'sms:bulk_sms' %}" class="btn btn-primary px-3">
                        <i class="bi bi-send-fill me-1"></i> Send New SMS
                    </a>
                    <a href="{% url 'sms:view_sms' %}" class="btn btn-outline-primary">
                        <i class="bi bi-clock-history me-1"></i> SMS Logs
                    </a>
                </div>

                <div class="vr mx-1 d-none d-md-block" style="height: 20px;"></div>

                <div class="btn-group btn-group-sm">
                    <button type="button" class="btn btn-outline-dark dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="bi bi-shield-lock me-1"></i> System Settings
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0">
                        <li><h6 class="dropdown-header">User & Organization</h6></li>
                        <li><a class="dropdown-item py-2" href="{% url 'accounts:view_users' %}"><i class="bi bi-people me-2"></i>System Users</a></li>
                        <li><a class="dropdown-item py-2" href="{% url 'dashboard:company_details' %}"><i class="bi bi-buildings me-2"></i>Company Profile</a></li>
                    </ul>
                </div>

            </div>
        </div>
    </div>
</div>
