{% extends 'base.html' %}
{% block title %}Add SMS Template — NODi Lite{% endblock %}
{% block content %}
<div class="page-shell">
    <div class="page-head">
        <div><h2><i class="bi bi-file-earmark-plus me-2"></i>Add SMS Template</h2></div>
        <a href="{% url 'sms:template_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body p-4">
                    <form method="post" class="d365-form">
                        {% csrf_token %}
                        <div class="field-group">
                            <label for="id_name">Name *</label>
                            <input type="text" name="name" id="id_name" required>
                        </div>
                        <div class="field-group">
                            <label for="id_body">Message *</label>
                            <textarea name="body" id="id_body" rows="4" required></textarea>
                            <span class="form-text">Available variables: <code>{name}</code>, <code>{amount}</code>, <code>{date}</code>, <code>{balance}</code>, <code>{reference}</code></span>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="is_active" id="id_is_active" checked>
                            <label class="form-check-label" for="id_is_active">Active</label>
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save</button>
                            <a href="{% url 'sms:template_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
