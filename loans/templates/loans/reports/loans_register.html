{% extends 'reports/_base_report.html' %}

{% block filters %}
<form method="get" class="filter-form row g-2 align-items-end">
  <div class="col-md-3">
    <label class="form-label">From</label>
    <input type="date" name="start_date" value="{{ start_date|date:'Y-m-d' }}" class="form-control form-control-sm">
  </div>
  <div class="col-md-3">
    <label class="form-label">To</label>
    <input type="date" name="end_date" value="{{ end_date|date:'Y-m-d' }}" class="form-control form-control-sm">
  </div>
  <div class="col-md-3">
    <label class="form-label">Product</label>
    <select name="product" class="form-select form-select-sm">
      <option value="">All products</option>
      {% for code, name in products %}
        <option value="{{ code }}" {% if code == product %}selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-3 text-end">
    <button class="btn btn-primary btn-sm w-100"><i class="bi bi-funnel"></i> Apply Filters</button>
  </div>
</form>
{% endblock %}
