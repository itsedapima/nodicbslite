{% extends "base.html" %}
{% block content %}
  {% include 'more_menu_transactions.html' %}

<div class="container my-5">
  {% include 'transactions/includes/transactions_quick_actions.html' %}
  <h3>Search customer for Posting</h3>

 {% for msg in messages %}
  <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
    {{ msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
{% endfor %}

  <!-- 🔎 Live Customer Search -->
  <div class="card p-3 mb-4">
    <label class="form-label">Search Customer</label>
    <input id="cust_search" type="text" class="form-control" placeholder="Search by Cust No, Name, Mobile, or National ID">
    <small class="form-text text-muted">Type at least 2 characters to search</small>
    <div id="search_results" class="mt-3"></div>
  </div>


<script>
(function(){
  // --- Customer Search ---
  const searchInput = document.getElementById('cust_search');
  const resultsDiv = document.getElementById('search_results');
  const postingForm = document.getElementById('posting_form');
  const custNoField = document.getElementById('id_cust_no');
  const custNameField = document.getElementById('cust_name');

  searchInput.addEventListener('input', function(){
    const q = this.value.trim();
    if(q.length < 2){
      resultsDiv.innerHTML = "";
      return;
    }
    fetch(`/transactions/api/customers/search/?q=${encodeURIComponent(q)}`)
      .then(r=>r.json())
      .then(data=>{
        resultsDiv.innerHTML = "";
        if(data.results && data.results.length){
          const table = document.createElement('table');
          table.className = "table table-sm table-bordered";
          table.innerHTML = `
            <thead>
              <tr>
                <th>Cust No</th>
                <th>Full Name</th>
                <th>National ID</th>
                <th>Mobile</th>
                <th>Action</th>
                <th>Statement</th>
              </tr>
            </thead>
            <tbody>
              ${data.results.map(c=>`
                <tr>
                  <td>${c.cust_no}</td>
                  <td>${c.full_name}</td>
                  <td>${c.national_id}</td>
                  <td>${c.mobile}</td>
                  <td>
                    <a href="/transactions/post/${c.id}/" 
                       onclick="window.open(this.href,'popup','width=1024,height=600'); return false;"
                       class="btn btn-primary btn-sm">Post</a>
                  </td>
                                    <td>
                    <a href="/statements/full-statement/${c.id}/" 
                       onclick="window.open(this.href,'popup','width=1024,height=600'); return false;"
                       class="btn btn-primary btn-sm">Full Statement</a>
                  </td>
                </tr>`).join('')}
            </tbody>`;
          resultsDiv.appendChild(table);
        } else {
          resultsDiv.innerHTML = "<div class='text-muted'>No customers found</div>";
        }
      })
      .catch(err => {
        console.error(err);
        resultsDiv.innerHTML = "<div class='text-danger'>Error searching customers</div>";
      });
  });

  // --- Loan Formset Row Add/Remove (same as your existing code) ---
  const addBtn = document.getElementById('addLoan');
  const rowsContainer = document.getElementById('loan-rows');

  function cloneEmptyForm(){
    const lastRow = rowsContainer.querySelector('.loan-row');
    if(!lastRow) return;
    const newRow = lastRow.cloneNode(true);
    newRow.querySelectorAll('input, select').forEach(el => {
      if (el.type === 'number' || el.type==='text') el.value = '';
      if (el.tagName.toLowerCase()==='select') el.selectedIndex = 0;
    });
    rowsContainer.appendChild(newRow);
    attachRemove(newRow.querySelector('.remove-row'));
    updateFormsetIndices();
  }

  function attachRemove(btn){
    if(!btn) return;
    btn.addEventListener('click', function(){
      const row = btn.closest('.loan-row');
      if(row) {
        row.remove();
        updateFormsetIndices();
      }
    });
  }

  function updateFormsetIndices(){
    const rows = rowsContainer.querySelectorAll('.loan-row');
    rows.forEach((row, i) => {
      row.querySelectorAll('select, input').forEach(el => {
        const base = el.name.split('-').slice(-1)[0];
        el.name = `form-${i}-${base}`;
        el.id = `id_form-${i}-${base}`;
      });
    });
    const totalForms = document.querySelector('#id_form-TOTAL_FORMS');
    if(totalForms) totalForms.value = rows.length;
  }

  document.querySelectorAll('.remove-row').forEach(attachRemove);
  if(addBtn) addBtn.addEventListener('click', cloneEmptyForm);

})();
</script>
{% endblock %}
