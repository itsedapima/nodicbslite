{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  {% include 'transactions/includes/transactions_quick_actions.html' %}
  <h2>Delete Account</h2>
  <p>Are you sure you want to delete <strong>{{ account.account_name }}</strong> ({{ account.account_code }})?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'transactions:account_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
