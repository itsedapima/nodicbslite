{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
  <h4>Member Statement (Running Balance)</h4>

  <form id="stmt_form" class="row g-2 align-items-end">
    <div class="col-auto">
      <label class="form-label">Search Customer</label>
      <input id="search_input" type="text" class="form-control" placeholder="Type name, cust_no or national id">
      <input id="cust_no" name="cust_no" type="hidden">
      <div id="search_results" class="list-group position-absolute" style="z-index:2200; max-height:240px; overflow:auto; display:none;"></div>
    </div>

    <div class="col-auto">
      <label class="form-label">Account</label>
      <select id="account" name="account" class="form-select">
        <option value="savings">Savings</option>
        <option value="sharecapital">Share Capital</option>
        <option value="loan">Loan</option>
      </select>
    </div>

    <div class="col-auto">
      <label class="form-label">Loan Type</label>
      <select id="loan_type" name="loan_type" class="form-select" disabled>
        <option value="normal_loan">normal_loan</option>
        <option value="emergency_loan">emergency_loan</option>
        <option value="mobile_loan">mobile_loan</option>
      </select>
    </div>

    <div class="col-auto">
      <label class="form-label">From</label>
      <input id="from_date" name="from_date" type="date" class="form-control">
      <div class="form-check">
        <input id="use_from" class="form-check-input" type="checkbox">
        <label class="form-check-label small" for="use_from">Use</label>
      </div>
    </div>

    <div class="col-auto">
      <label class="form-label">To</label>
      <input id="to_date" name="to_date" type="date" class="form-control">
      <div class="form-check">
        <input id="use_to" class="form-check-input" type="checkbox">
        <label class="form-check-label small" for="use_to">Use</label>
      </div>
    </div>

    <div class="col-auto">
      <button id="btn_preview" type="button" class="btn btn-primary">Preview</button>
      <button id="btn_download" type="button" class="btn btn-success">Download</button>
      <a href="{% url 'dashboard:dashboard' %}" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>
  </form>

  <div class="mt-3">
    <pre id="stm_text" style="white-space:pre-wrap; font-family: 'Courier New', monospace; font-size:12px; border:1px solid #ddd; padding:12px; height:420px; overflow:auto;">
    </pre>
  </div>
</div>

<script>
(function(){
  const searchInput = document.getElementById('search_input');
  const resultsDiv = document.getElementById('search_results');
  const custNoInput = document.getElementById('cust_no');
  const accountSelect = document.getElementById('account');
  const loanTypeSelect = document.getElementById('loan_type');
  const useFrom = document.getElementById('use_from');
  const useTo = document.getElementById('use_to');
  const fromDate = document.getElementById('from_date');
  const toDate = document.getElementById('to_date');
  const previewBtn = document.getElementById('btn_preview');
  const downloadBtn = document.getElementById('btn_download');
  const stmText = document.getElementById('stm_text');

  let searchTimer = null;

  // Toggle loan_type enabled when account == loan
  accountSelect.addEventListener('change', function(){
    if(this.value === 'loan'){
      loanTypeSelect.disabled = false;
    } else {
      loanTypeSelect.disabled = true;
    }
  });

  // Live search (debounced)
  searchInput.addEventListener('input', function(){
    const q = this.value.trim();
    custNoInput.value = ""; // reset stored cust_no while typing (like Tk)
    if(searchTimer) clearTimeout(searchTimer);
    if(!q){
      resultsDiv.style.display = 'none';
      resultsDiv.innerHTML = "";
      return;
    }
    searchTimer = setTimeout(()=> {
      fetch(`/statements/customer-search/?q=${encodeURIComponent(q)}`)
        .then(r => r.json())
        .then(data => {
          resultsDiv.innerHTML = "";
          if(!data.results || data.results.length === 0){
            resultsDiv.style.display = 'none';
            return;
          }
          data.results.forEach(c => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'list-group-item list-group-item-action';
            btn.textContent = `${c.full_name} (${c.cust_no}) — ${c.mobile || ''}`;
            btn.addEventListener('click', () => {
              searchInput.value = `${c.full_name} (${c.cust_no})`;
              custNoInput.value = c.cust_no;  // store numeric cust_no
              resultsDiv.style.display = 'none';
              resultsDiv.innerHTML = "";
            });
            resultsDiv.appendChild(btn);
          });
          resultsDiv.style.display = 'block';
        })
        .catch(err => {
          console.error(err);
          resultsDiv.style.display = 'none';
        });
    }, 180);
  });

  // Hide results if click outside
  document.addEventListener('click', function(e){
    if(!resultsDiv.contains(e.target) && e.target !== searchInput){
      resultsDiv.style.display = 'none';
    }
  });

  // Build query params helper
  function buildParams(){
    const params = new URLSearchParams();
    const cust_raw = custNoInput.value || searchInput.value || "";
    params.set('cust_no', cust_raw);
    params.set('account', accountSelect.value);
    params.set('loan_type', loanTypeSelect.value);
    if(useFrom.checked && fromDate.value) {
      params.set('use_from', '1'); params.set('from_date', fromDate.value);
    }
    if(useTo.checked && toDate.value) {
      params.set('use_to', '1'); params.set('to_date', toDate.value);
    }
    return params.toString();
  }

  previewBtn.addEventListener('click', function(){
    const qs = buildParams();
    if(!qs) return;
    fetch(`/statements/preview/?${qs}`)
      .then(r => r.json())
      .then(data => {
        if(data.error){
          stmText.textContent = data.error;
          return;
        }
        // server returns "text"
        stmText.textContent = data.text || "";
        // keep results area hidden
        resultsDiv.style.display = 'none';
      })
      .catch(err => {
        console.error(err);
        stmText.textContent = "Error fetching preview";
      });
  });

  downloadBtn.addEventListener('click', function(){
    const qs = buildParams();
    if(!qs) return;
    // open download in new tab (PDF)
    const url = `/statements/download/?${qs}`;
    window.open(url, '_blank');
  });

  // allow pressing Enter when search has digits to directly preview
  searchInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      // mimic selection if pure digits
      const v = this.value.trim();
      if(/^\d+$/.test(v)){
        custNoInput.value = v;
      }
      previewBtn.click();
    }
  });

})();
</script>
{% endblock %}
