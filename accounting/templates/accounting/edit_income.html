{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto mt-20">
    <h2>Edit Income</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'accounting:income_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
