{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto mt-20">
    <h2>Edit MMF Description</h2>
    <hr>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{% url 'accounting:mmf_description_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
