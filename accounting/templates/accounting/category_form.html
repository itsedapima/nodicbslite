{% extends 'base.html' %}
{% block title %}Add Category — NODi Lite{% endblock %}
{% block content %}
<div class="page-shell">
    <div class="page-head">
        <div><h2><i class="bi bi-tags me-2"></i>Add Category</h2></div>
        <a href="{% url 'accounting:category_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body p-4">
                    <form method="post" class="d365-form">
                        {% csrf_token %}
                        <div class="field-group">
                            <label for="id_name">Name *</label>
                            <input type="text" name="name" id="id_name" required>
                        </div>
                        <div class="field-group">
                            <label for="id_type">Type *</label>
                            <select name="type" id="id_type" required>
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </div>
                        <div class="field-group">
                            <label for="id_description">Description</label>
                            <input type="text" name="description" id="id_description">
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="is_active" id="id_is_active" checked>
                            <label class="form-check-label" for="id_is_active">Active</label>
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save</button>
                            <a href="{% url 'accounting:category_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
