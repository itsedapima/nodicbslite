{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto mt-20">
    <h2>Select Group and MMF Description</h2>
    <hr>

    <form method="GET" action="{% url 'accounting:group_mmf_report' %}" class="mt-3">
        <div class="form-group">
            <label for="mmf_description">Select MMF Description:</label>
            <select name="mmf_description" id="mmf_description" class="form-control">
                {% for mmf in mmf_descriptions %}
                <option value="{{ mmf.id }}">{{ mmf.description }} ({{ mmf.financial_start_date }} - {{ mmf.financial_end_date }})</option>
                {% endfor %}
            </select>
            <label for="group">Select Group:</label>
            <select name="group" id="group" class="form-control">
                {% for group in groups %}
                <option value="{{ group.id }}">{{ group.name }} </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Generate Report</button>
        <a href="{% url 'accounting:mmf_description_list'%}" class="btn btn-secondary">Back</a>
    </form>
</div>
{% endblock %}
