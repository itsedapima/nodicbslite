
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0E2B4D">
    <title>{% block title %}SACCO MIS{% endblock %}</title>
    {% load static %}

    {# Bootstrap 5 (was BS 4.5 — upgraded for parity with base.html) #}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    {# Shared D365 theme #}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">

    <style>
        /* Standalone pages don't have a header/footer — drop the offsets */
        body { padding-top: 0; padding-bottom: 0; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    {# Bootstrap 5 bundle (includes Popper) — was BS 4.5 separately. #}
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
