{% extends 'base.html' %}
{% block title %}Backup Configuration — NODi Lite{% endblock %}
{% block content %}
<div class="page-shell">
    <div class="page-head">
        <div>
            <h2><i class="bi bi-gear me-2"></i>Backup Configuration</h2>
            <p class="page-sub">Configure automatic database backup settings</p>
        </div>
        <a href="{% url 'administration:backup_list' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body p-4">
                    <form method="post" class="d365-form">
                        {% csrf_token %}
                        <div class="field-group">
                            <label for="id_schedule">Schedule *</label>
                            <select name="schedule" id="id_schedule" required>
                                <option value="hourly" {% if config.schedule == 'hourly' %}selected{% endif %}>Hourly</option>
                                <option value="daily" {% if config.schedule == 'daily' %}selected{% endif %}>Daily</option>
                                <option value="weekly" {% if config.schedule == 'weekly' %}selected{% endif %}>Weekly</option>
                                <option value="monthly" {% if config.schedule == 'monthly' %}selected{% endif %}>Monthly</option>
                            </select>
                        </div>
                        <div class="field-group">
                            <label for="id_retention_days">Retention Days</label>
                            <input type="number" name="retention_days" id="id_retention_days" min="1"
                                   value="{{ config.retention_days|default:30 }}"
                                   placeholder="Number of days to keep backups">
                        </div>
                        <div class="field-group">
                            <label for="id_storage_path">Storage Path</label>
                            <input type="text" name="storage_path" id="id_storage_path"
                                   value="{{ config.storage_path|default:'' }}"
                                   placeholder="/var/backups/nodicbs/">
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i> Save Configuration
                            </button>
                            <a href="{% url 'administration:backup_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
