{% extends 'base.html' %}
{% block content %}
<div class="container my-5 mx-auto px-4 max-w-md text-center">
    <div class="bg-white shadow-lg rounded-lg p-8 border border-red-200">
        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        
        <h2 class="text-xl font-bold text-gray-800 mb-2">Delete Branch?</h2>
        <p class="text-gray-500 text-sm mb-6">Are you sure you want to permanently remove <strong>{{ branch.name }} ({{ branch.branch_code }})</strong>? This step cannot be undone.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="flex justify-center gap-3">
                <button type="submit" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded text-sm font-medium shadow-sm">Yes, Delete</button>
                <a href="{% url 'administration:branch_detail' branch.pk %}" class="px-5 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded text-sm font-medium shadow-sm">No, Keep It</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
